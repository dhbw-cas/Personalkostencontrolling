[project]
name = "1052-buchungsimporteur-sap-lbv"
version = "0.1.0"
description = "Excel-zu-Excel Transformationstool für SAP LBV Buchungsimport"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.0",
    "pandas>=2.0.0", 
    "pydantic>=2.0.0",
    "streamlit>=1.35.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
buchungsimporteur = "buchungsimporteur.cli:app"
buchungsimporteur-app = "buchungsimporteur.streamlit_runner:main"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pandas-stubs>=2.3.0.250703",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
    "types-openpyxl>=3.1.5.20250602",
]

[tool.hatch.build.targets.wheel]
packages = ["src/buchungsimporteur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]
